stages:
  - build
  - deploy

.build-docker-image:
  image: docker:24.0.5-cli
  stage: build
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
    - docker build -t $CI_REGISTRY/gist-app .
    - docker push $CI_REGISTRY/gist-app

.deploy-app:
  image: docker:18
  stage: deploy
  script:
    -  docker compose -f .gitlab/docker-compose.yml up